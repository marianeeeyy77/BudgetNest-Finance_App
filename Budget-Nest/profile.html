<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | BudgetNest</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        <span>💰</span> BudgetNest
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="budget.html">Budget</a>
        <a href="transactions.html">Transactions</a>
        <a href="profile.html" class="active">Profile</a>
    </nav>

</header>


<main class="dashboard-container">

    <div class="page-heading">

        <div>

            <span class="badge">Account</span>

            <h1>My Profile 👤</h1>

            <p>
                Manage your personal information.
            </p>

        </div>

    </div>


    <section class="profile-layout">

        <div class="profile-card">

            <div class="profile-avatar">
                👤
            </div>

            <h2 id="profileName">
                BudgetNest User
            </h2>

            <p id="profileEmail">
                user@example.com
            </p>

            <span class="profile-badge">
                Personal Account
            </span>

        </div>


        <div class="content-card">

            <h2>Personal Information</h2>

            <p class="card-description">
                Update your profile details.
            </p>


            <form id="profileForm">

                <label for="profileNameInput">
                    Full Name
                </label>

                <input
                    type="text"
                    id="profileNameInput"
                    placeholder="Your name"
                    required
                >


                <label for="profileEmailInput">
                    Email Address
                </label>

                <input
                    type="email"
                    id="profileEmailInput"
                    placeholder="you@example.com"
                    required
                >


                <button type="submit" class="primary-button">
                    Save Changes
                </button>

            </form>

            <p id="profileMessage" class="form-message"></p>

        </div>

    </section>

</main>


<footer>
    <p>© 2026 BudgetNest. Personal finance made simple.</p>
</footer>


<script src="js/app.js"></script>

</body>
</html>
